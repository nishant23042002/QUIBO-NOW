packages:
  - apps/*
  - packages/*

# One place for versions shared by several workspaces. Exact versions, no ranges.
catalog:
  # TypeScript stays below 6.1: typescript-eslint 8.x declares "typescript <6.1.0".
  # See docs/decisions/0003-toolchain-version-pins.md.
  typescript: 6.0.3
  eslint: 10.12.0
  '@eslint/js': 10.0.1
  typescript-eslint: 8.71.1
  globals: 17.13.0
  '@types/node': 24.19.1
  next: 16.4.0
  zod: 4.6.5
  vitest: 5.0.3
  # React is pinned to what Expo SDK 57 ships (19.2.3): one React version in the whole repo.
  react: 19.2.3
  react-dom: 19.2.3
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.7
  storybook: 10.6.1
  playwright: 1.64.0
  vite: 8.3.3
  tailwindcss: 4.3.3
  next-intl: 4.14.9
  '@tailwindcss/postcss': 4.3.3
  '@playwright/test': 1.64.0
  '@axe-core/playwright': 4.13.0

# A missing peer dependency is reported, never installed behind our back. Expo Go contains one
# fixed version of each native module, and a peer installed at "latest" would not match it.
autoInstallPeers: false

# eslint-config-next bundles eslint-plugin-react, -import and -jsx-a11y. Their
# published peer ranges stop at ESLint 9, but ESLint 9 reached end of life on
# 2026-08-06 and the rules were checked to run correctly on ESLint 10. Only these
# plugins are allowed, so any other peer problem still prints.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-react>eslint: '10'
    eslint-plugin-import>eslint: '10'
    eslint-plugin-jsx-a11y>eslint: '10'
  # expo-router needs these two only for its Drawer and JS-stack layouts. This project uses the
  # native stack, which loads neither, and keeping them out saves memory on 2 GB phones.
  ignoreMissing:
    - react-native-reanimated
    - react-native-gesture-handler

# Expo's config plugins pull in xcode, which uses uuid 7.0.3 (deprecated). It only runs in build
# tooling and is never part of the app. Allowed by exact version, so any other deprecation prints.
allowedDeprecatedVersions:
  uuid: 7.0.3

# pnpm 10 skips dependency install scripts unless listed. unrs-resolver (pulled in
# by eslint-config-next) only runs a postinstall that checks its native binding,
# which already arrives as an optional platform package and loads without it.
ignoredBuiltDependencies:
  - unrs-resolver
  # esbuild (pulled in by Storybook) only runs a postinstall that checks its platform binary,
  # which arrives as an optional platform package and works without it.
  - esbuild
  # next-intl pulls in @parcel/watcher and @swc/core for its optional message extractor, which
  # this project does not use. Both ship prebuilt binaries as optional packages; the dev server
  # and the production build were run without their install scripts.
  - '@parcel/watcher'
  - '@swc/core'
