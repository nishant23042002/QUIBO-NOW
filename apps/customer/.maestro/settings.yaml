# Settings: the shortcuts, switching language and back, and logging out.
#
# Run it against the app open in Expo Go, on a fresh install:
#   maestro test apps/customer/.maestro/settings.yaml -e APP_URL=exp://<your computer's address>:8081
#
# Written in Phase 1 (settings, 1g). It has not been run yet: the Maestro tool is not installed on the machine this was written on.
appId: host.exp.exponent
---
- launchApp:
    clearState: true
- openLink: ${APP_URL}
- tapOn: 'Skip sign-in (testing)'
- assertVisible: 'Delivering in.*|Arriving.*'

# From Home's profile button.
- tapOn: 'Profile'
- assertVisible: 'Settings'
- assertVisible: 'Saved addresses'
- assertVisible: 'Your orders'
- assertVisible: 'Help'

# A shortcut: the address list, and back.
- tapOn: 'Saved addresses'
- assertVisible: 'Delivery address'
- tapOn: 'Back'
- assertVisible: 'Settings'

# Language changes the words at once, and back again.
- tapOn: 'हिन्दी'
- assertVisible: 'सेटिंग'
- tapOn: 'English'
- assertVisible: 'Settings'

# Log out: the first-run steps come back, with the language kept.
- tapOn: 'Log out'
- assertVisible: 'Choose your language'
