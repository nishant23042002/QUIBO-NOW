# The category flow: use a category in Home's header rail, open a category from the Categories tab, move between its kinds, sort it and filter it.
#
# Run it against the app open in Expo Go, on a fresh install so the language is English:
#   maestro test apps/customer/.maestro/category.yaml -e APP_URL=exp://<your computer's address>:8081
#
# Written in Phase 1 (category screens, filters and sort). It has not been run yet: the Maestro tool is not installed on the machine
# this was written on. Names are the ones a screen reader says, so the flow also checks that they exist.
appId: host.exp.exponent
---
- launchApp:
    clearState: true
- openLink: ${APP_URL}
# A fresh install starts with the first-run steps: a development build lets a tester pass them.
- tapOn: 'Skip sign-in (testing)'
- assertVisible: 'Estimated delivery|Scheduled delivery'

# A category in the header rail shows its own page, and "All" in the rail brings the usual page back.
- tapOn: 'Dairy'
- assertVisible: 'Amul Toned milk.*'
- assertNotVisible: 'Coming soon to Roha'
- tapOn: 'All'
- scrollUntilVisible:
    element: 'Coming soon to Roha'

# Daily essentials (ADR 0048): a tab swaps the list, a row ticks, and the bar adds what is ticked.
- assertVisible: 'Daily essentials'
- tapOn: 'Cooking'
- assertVisible: 'Potato\. .*'
- tapOn: 'Evening'
- assertVisible: 'Lay.s Potato chips\. .*'
- tapOn: 'Lay.s Potato chips\. .*'
- assertVisible: 'Add 1 item.*'

# Shop for your need: a card opens its own page with a shelf for each thing it gathers. It is below the first screen now.
- scrollUntilVisible:
    element: 'Shop for your need'
- tapOn: 'Tea Time.*'
- assertVisible: 'Picked from shops in Roha'
- assertVisible: 'Amul Toned milk.*'
- tapOn: 'Back'
- scrollUntilVisible:
    element: 'Coming soon to Roha'

# Notify me (ADR 0055): a card on "Coming soon to Roha" turns on and says it will tell the shopper, and turns off again.
- tapOn: 'Beauty & Care.*'
- assertVisible: 'We.ll tell you'
- tapOn: 'Beauty & Care.*'
- assertNotVisible: 'We.ll tell you'

# All categories is the Categories tab (ADR 0046, ADR 0055): every group, the stocked categories as rows and those coming as tiles
# with Notify me, and a field to find a category. A tile that is coming turns Notify me on instead of opening a page.
- tapOn: 'All categories.*'
- assertVisible: 'Grocery & Kitchen'
- assertVisible: 'Find a category'
- scrollUntilVisible:
    element: 'Beauty, Soon.*'
- tapOn: 'Beauty, Soon.*'
- assertVisible: 'Beauty, .*Notify.*'
- tapOn: 'Home'
- scrollUntilVisible:
    element: 'Coming soon to Roha'

# The Categories tab: each category is a row of tiles (its own, then its kinds), and its own tile opens its screen.
- tapOn: 'Categories'
- assertVisible: 'Grocery & Kitchen'
- assertVisible: 'Snacks & Drinks'
- assertVisible: 'Curd & Yogurt'
- tapOn: 'Dairy & Eggs'
- assertVisible: 'Curd & Yogurt'
- assertVisible: 'Filters'

# A kind in the left rail narrows the grid.
- tapOn: 'Curd & Yogurt'
- assertVisible: 'Gokul Fresh curd.*'
- assertNotVisible: 'Add Amul Toned milk'

# Sort: a sheet of radio choices.
- tapOn: 'Sort'
- assertVisible: 'Sort by'
- assertVisible: 'Price: low to high'
- tapOn: 'Biggest saving'
- assertNotVisible: 'Sort by'

# Filters: the list of this category's filters, the choices of the open one, and Apply with how many items it leaves.
- tapOn: 'Filters'
- assertVisible: 'Brand'
- tapOn: 'Brand'
- tapOn: 'Gokul.*'
- assertVisible: 'Apply.*'
- tapOn: 'Apply.*'
- assertVisible: 'Gokul Fresh curd.*'
- assertNotVisible: 'Amul Masti dahi.*'

# Back returns to the Categories tab.
- tapOn: 'Back'
- assertVisible: 'Grocery & Kitchen'
