# The category flow: use a chip under Home's banner and a department in its header rail, open a category from the Categories tab, move between its kinds, sort it and filter it.
#
# Run it against the app open in Expo Go, on a fresh install so the language is English:
#   maestro test apps/customer/.maestro/category.yaml -e APP_URL=exp://<your computer's address>:8081
#
# Written in Phase 1 (category screens, filters and sort). It has not been run yet: the Maestro tool is not installed on the machine
# this was written on. Names are the ones a screen reader says, so the flow also checks that they exist.
appId: host.exp.exponent
---
- launchApp:
    clearState: true
- openLink: ${APP_URL}
# A fresh install starts with the first-run steps: a development build lets a tester pass them.
- tapOn: 'Skip sign-in (testing)'
- assertVisible: 'Delivering in.*|Arriving.*'

# A chip under Home's banner shows what suits it, and "All" brings the usual page back.
- tapOn: 'Offers'
- assertVisible: 'Amul Toned milk.*'
- tapOn: 'All'
- assertVisible: 'Shop by department'

# A department in the header rail shows its own page, and "All" in the rail brings the usual page back.
- tapOn: 'Dairy'
- assertVisible: 'Amul Toned milk.*'
- assertNotVisible: 'Shop by department'
- tapOn: 'All'
- assertVisible: 'Shop by department'

# Shop for your need: a card opens its own page with a shelf for each thing it gathers.
- assertVisible: 'Shop for your need'
- tapOn: 'Tea Time.*'
- assertVisible: 'Picked from shops in Roha'
- assertVisible: 'Amul Toned milk.*'
- tapOn: 'Back'
- assertVisible: 'Shop by department'

# All departments: every department in its group, and one that is not stocked opens its "Coming to Roha" page.
- tapOn: 'All departments.*'
- assertVisible: 'Coming to Roha'
- tapOn: 'Beauty, Soon'
- assertVisible: 'Beauty is not in Roha yet.*'
- tapOn: 'Back'
- tapOn: 'Back'
- assertVisible: 'Shop by department'

# The Categories tab: two sections, and a category opens its own screen.
- tapOn: 'Categories'
- assertVisible: 'Grocery & Kitchen'
- assertVisible: 'Snacks & Drinks'
- tapOn: 'Dairy & Eggs'
- assertVisible: 'Curd & Yogurt'
- assertVisible: 'Filters'

# A kind in the left rail narrows the grid.
- tapOn: 'Curd & Yogurt'
- assertVisible: 'Gokul Fresh curd.*'
- assertNotVisible: 'Add Amul Toned milk'

# Sort: a sheet of radio choices.
- tapOn: 'Sort'
- assertVisible: 'Sort by'
- assertVisible: 'Price: low to high'
- tapOn: 'Biggest saving'
- assertNotVisible: 'Sort by'

# Filters: the list of this category's filters, the choices of the open one, and Apply with how many items it leaves.
- tapOn: 'Filters'
- assertVisible: 'Brand'
- tapOn: 'Brand'
- tapOn: 'Gokul.*'
- assertVisible: 'Apply.*'
- tapOn: 'Apply.*'
- assertVisible: 'Gokul Fresh curd.*'
- assertNotVisible: 'Amul Masti dahi.*'

# Back returns to the Categories tab.
- tapOn: 'Back'
- assertVisible: 'Grocery & Kitchen'
