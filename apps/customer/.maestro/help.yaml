# Help from an order: the way to a person, the common questions, and reporting a problem with an order.
#
# Run it against the app open in Expo Go, on a fresh install:
#   maestro test apps/customer/.maestro/help.yaml -e APP_URL=exp://<your computer's address>:8081
#
# Written in Phase 1 (help, 1g). It has not been run yet: the Maestro tool is not installed on the machine this was written on.
# Tapping "Call us" and "WhatsApp" hands over to the phone's dialer and to WhatsApp, which a flow cannot read: it checks that the
# app survives the hand-over and is still on Help when it comes back. What they open is for a person to look at.
appId: host.exp.exponent
---
- launchApp:
    clearState: true
- openLink: ${APP_URL}
- tapOn: 'Skip sign-in (testing)'
- assertVisible: 'Delivering in.*|Arriving.*'

# An order to ask about: one thing, cash on delivery.
- tapOn: 'Add Toned milk'
- tapOn: 'Cart, .*'
- tapOn: 'Continue'
- tapOn: 'Place order'
- extendedWaitUntil:
    visible: 'Cancel order'
    timeout: 20000

# Help opens from the order, already about it.
- scrollUntilVisible:
    element: 'Need help with this order?'
- tapOn: 'Need help with this order?'
- assertVisible: 'Talk to a person'
- assertVisible: 'Every day, 8 AM to 10 PM'

# The two ways to a person. Each hands over to another app, and Help is still there on the way back.
- tapOn: 'Call us'
- pressKey: back
- assertVisible: 'Talk to a person'
- tapOn: 'WhatsApp'
- pressKey: back
- assertVisible: 'Talk to a person'

# A common question opens in place.
- tapOn: 'Can I cancel my order?'
- assertVisible: 'Yes, until the shop has packed it.*'

# Report a problem: the order is already chosen, an item has to be named, and it is kept.
- tapOn: 'Report a problem with an order'
- assertVisible: 'Which order?'
- assertVisible: 'An item was missing'
- assertVisible: 'Which items?'
- tapOn: 'Toned milk'
- tapOn: 'Send report'
- extendedWaitUntil:
    visible: 'We have it'
    timeout: 5000
- tapOn: 'Done'
- assertVisible: 'Your reports'
