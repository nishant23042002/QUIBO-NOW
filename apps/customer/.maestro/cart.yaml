# The cart flow: add things from Home, change a quantity, take one out and put it back, and see the bill and the way forward.
#
# Run it against the app open in Expo Go, on a fresh install so the cart starts empty and the language is English:
#   maestro test apps/customer/.maestro/cart.yaml -e APP_URL=exp://<your computer's address>:8081
#
# Written in Phase 1 (cart, 1d). It has not been run yet: the Maestro tool is not installed on the machine this was written on.
# Names are the ones a screen reader says, so the flow also checks that they exist.
appId: host.exp.exponent
---
- launchApp:
    clearState: true
- openLink: ${APP_URL}
# A fresh install starts with the first-run steps: a development build lets a tester pass them.
- tapOn: 'Skip sign-in (testing)'
- assertVisible: 'Delivering in.*|Arriving.*'

# Add the milk from Daily essentials: tick it and add it. The row then has its stepper, so one more is a tap on plus.
- tapOn: 'Morning'
- tapOn: 'Amul Toned milk\. 500 ml.*'
- tapOn: 'Add 1 item.*'
- assertVisible: 'Remove one Amul Toned milk'
- tapOn: 'Add one Amul Toned milk'
- assertVisible: 'Cart, 2 items'

# Open the cart from its tab.
- tapOn: 'Cart, 2 items'
- assertVisible: 'Your cart'
- assertVisible: 'Amul Toned milk'
- assertVisible: 'Bill summary'
- assertVisible: 'Continue'

# Change a quantity: down to one.
- tapOn: 'Remove one Amul Toned milk'
- assertVisible: 'Cart, 1 items'

# Take the last one out: the cart says so and offers to undo it.
- tapOn: 'Remove one Amul Toned milk'
- assertVisible: 'Your cart is empty'
- assertVisible: 'Undo'
- tapOn: 'Undo'
- assertNotVisible: 'Your cart is empty'
- assertVisible: 'Amul Toned milk'

# The way forward is there.
- assertVisible: 'Continue'
